name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned, not floating. `forge fmt` rules change between releases, so an unpinned toolchain can
  # turn this repository red with no code change at all. That is not hypothetical: v1.8.3 was
  # published 2026-09-15T12:49:47Z and the run four minutes later was already on it. The version
  # below is the one that produced the green run on 8bd9fb5.
  FOUNDRY_VERSION: v1.8.3

jobs:
  # Formatting is its own job on purpose. When it lived in the `check` job, a formatting failure
  # skipped build, tests, the BOM check, the canon check, the ABI check, the recorder self-test
  # and both refusal checks -- twelve steps, for two commits, silently. A gate that hides the
  # gates behind it is worse than no gate.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned by SHA as well as by version: a moving tag can change what "foundry-toolchain@v1"
      # installs without any commit here.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # A BOM has bitten this repository twice: it makes the first pattern in .gitattributes
      # silently ineffective (the pattern becomes "\ufeff*"), and forge fmt rejects a .sol file
      # that starts with one. Cheaper to check than to remember.
      - name: No byte-order marks in text files
        run: |
          if grep -rlI $'\xef\xbb\xbf' . \
               --exclude-dir=.git --exclude-dir=lib --exclude-dir=out \
               --exclude-dir=cache --exclude-dir=broadcast; then
            echo "FAIL: byte-order mark found in the files listed above"
            exit 1
          fi
          echo "OK: no byte-order marks"

      # The canon name -> value mapping has one source. It used to have two -- a keccak
      # comparison in script/Deploy.s.sol and a literal in tools/record_deployment.py -- with
      # nothing comparing them, which would have rejected a correct deployment on the day a new
      # canon arrived. Guard the single source and guard against the literal creeping back.
      - name: canon.json is the single source of the canon mapping
        run: |
          python -c "
          import json
          canons = json.load(open('canon.json'))['canons']
          assert canons, 'canon.json has no canons'
          for name, value in canons.items():
              assert isinstance(value, int) and not isinstance(value, bool), (name, value)
              assert 1 <= value <= 255, (name, value)
          print('canon.json OK:', canons)
          "
          # Only the comparison is checked, not the wording. The first version of this check
          # also matched "expected N for", which is prose inside a docstring explaining what
          # the old message used to say -- so the check failed on its own comment. A text check
          # has to aim at the code, not at anything mentioning the code.
          if grep -nE 'canon_onchain[[:space:]]*!=[[:space:]]*[0-9]+' tools/record_deployment.py; then
            echo "FAIL: the canon value is hardcoded in the recorder again; read canon.json"
            exit 1
          fi
          if grep -nE 'keccak256\(bytes\("rhdepth' script/Deploy.s.sol; then
            echo "FAIL: the canon mapping is hardcoded in the deploy script again"
            exit 1
          fi
          echo "OK: the mapping appears once"

      # The ABI is committed so a consumer can `git pull` it instead of keeping a second copy.
      # A committed derived file is only safe if something checks it, so this is that check.
      - name: The committed ABI must match the contract
        run: python tools/export_abi.py --check

      # The on-chain guard is deliberately off-chain and lives in tools/. It is part of the
      # deliverable, so it is checked here rather than only on the machine that runs it.
      - name: Check the backfill tooling
        run: |
          python -m compileall -q tools
          python tools/round_count.py --help > /dev/null
          python tools/record_deployment.py --help > /dev/null
          python tools/check_backfill_list.py --help > /dev/null

      # "--help exits 0" says the file parses. It does not say the checker refuses anything.
      # The two cases that matter most are the two that used to pass: an entry whose hash was
      # invented (it was reported, never compared, and the record still opened the submit gate)
      # and an empty list. This asserts refusal, in a temp dir, with no data and no network.
      - name: The backfill checker must refuse a bad list
        run: python tools/check_backfill_list.py --selftest

      # The write side refuses the same set the read side refuses, plus key separation. The
      # reader has a self-test; this is its mirror, and it touches no file and no network.
      - name: Deployment recorder self-test
        run: python tools/record_deployment.py --selftest

      # "A value that has to be typed by hand is the only evidence that the decision has not
      # been taken by something else." Prove it stays that way. No --rpc-url, so this runs
      # against a local EVM: the failure must come from the missing variable, not from a
      # missing chain.
      - name: The deploy script must refuse to default
        run: |
          out=$(forge script script/Deploy.s.sol --unlocked \
                  --sender 0x0000000000000000000000000000000000000001 2>&1 || true)
          echo "$out"
          grep -q 'environment variable "LEDGER_CHAIN_ID" not found' <<<"$out" \
            && echo "OK: refused to default" \
            || { echo "FAIL: the deploy script did not refuse a missing LEDGER_CHAIN_ID"; exit 1; }

      # A missing RPC must not silently mean "no guard" in the tooling either.
      - name: The round-count guard must not silently skip
        run: |
          out=$(python tools/round_count.py --data /nonexistent 2>&1 || true)
          grep -q 'data root not found' <<<"$out" \
            && echo "OK: reported the missing data root" \
            || { echo "FAIL: missing data root was not reported"; exit 1; }
